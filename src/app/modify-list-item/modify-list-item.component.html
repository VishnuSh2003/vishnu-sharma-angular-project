
<form [formGroup]="fighterForm"(ngSubmit)="onSubmit()">

<div class="form-group">
  <label for="fighterid">Fighter ID</label>
  <input type="number" id="fighterid" formControlName="fighterid" />
</div>

<div class="form-group">
  <label for="firstName">First Name</label>
  <input type="text" id="firstName" formControlName="fighterid"/>

</div>

<div class="form-group">
  <label for="lastName">last Name</label>
  <input type="text" id="lastName" formControlName="lastName" />
</div>

<div class="form-group">
  <label for="weightClass">Weight Class</label>
  <input type="text" id="weightClass" formControlName="weightClass" />
</div>
<div class="form-group">
  <label for="wins">Wins</label>
  <input type="number" id="wins" formControlName="wins" />
</div>
<div class="form-group">
  <label for="losses">Losses</label>
  <input type="number" id="losses" formControlName="losses" />
</div>
<div class="form-group">
  <label for="isChampion">Is Champion</label>
  <input type="checkbox" id="isChampion" formControlName="isChampion" />
</div>
<!--for submit-->
<button type="submit">Submit</button>
<!--for delete-->

<button type="button" (click)="onDelete()">Delete</button>

<!--back button-->
<button type="button" (click)="navigateToFighterList()">Back to List</button>
</form>
<div *ngIf="error" class="error">{{ error }}</div>
